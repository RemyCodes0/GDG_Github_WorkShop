name: Security scanning

# Automated security checks for AUB Collab.
#   CodeQL:          finds vulnerable code patterns in Python and JavaScript
#   Dependency audit: flags known vulnerabilities in pip and npm packages
#   Secret scan:     stops passwords, tokens and keys from being committed
#   Dependency review: blocks pull requests that add a vulnerable package
# Runs on pull requests, on pushes to main, and every Monday so new
# vulnerabilities in existing dependencies are caught even without code changes.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  python-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit Backend/requirements.txt
        run: pip-audit --requirement Backend/requirements.txt --strict --desc on

  npm-audit:
    name: npm dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Production dependencies must have no high or critical issues.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      # Dev tooling is reported but does not fail the build.
      - name: Report dev dependency issues
        run: npm audit --audit-level=high || echo "::warning::npm audit found issues in dev dependencies"

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  django-deploy-check:
    name: Django deployment settings
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Backend
    env:
      DJANGO_SECRET_KEY: ${{ github.run_id }}-ci-only-a-long-random-looking-value-for-the-deploy-check-0123456789
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: aubcollab.example.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: Backend/requirements.txt

      - run: pip install -r requirements.txt

      # Lists production hardening gaps (HTTPS, secure cookies, HSTS).
      # Reported as warnings for now because the project has no production host yet.
      - name: Run manage.py check --deploy
        run: python manage.py check --deploy || echo "::warning::Django deployment checks reported issues, see the log above"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Needs the repository's dependency graph (Settings > Code security > Dependency graph).
      # Until a maintainer turns it on, report a warning instead of failing every pull request.
      - name: Check that the dependency graph is enabled
        id: graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/dependency-graph/sbom" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Dependency review skipped: enable the dependency graph in Settings > Code security"
          fi

      - uses: actions/dependency-review-action@v4
        if: steps.graph.outputs.enabled == 'true'
        with:
          fail-on-severity: high
